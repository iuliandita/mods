name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # mods/*/mod.json verified_on records this same version (tests/test_ci_pin.py checks it)
  CLAUDE_CODE_VERSION: "2.1.296"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -m "not integration"
      - run: scripts/mods validate --no-claude

  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODS_REQUIRE_CLAUDE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # pinned to the version the mods record as verified_on
      - run: npm install -g --ignore-scripts @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}
      # install.cjs is run by hand: --ignore-scripts skips the install script and the native binary
      # needs it; integrity relies on the registry's per-version signature, not a lockfile
      - run: node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
      - run: claude --version | grep -F "$CLAUDE_CODE_VERSION"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -m integration
      - run: scripts/mods validate
